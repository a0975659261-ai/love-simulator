.hidden-name-panel {

.glitch {
  animation: glitch 0.15s linear 4;
}

@keyframes glitch {
  0% {
    transform: translate(0);
  }

  25% {
    transform: translate(-4px, 2px);
  }

  50% {
    transform: translate(4px, -2px);
  }

  75% {
    transform: translate(-2px, -2px);
  }

  100% {
    transform: translate(0);
  }
}


.memory-flash {
  animation: flash 0.5s;
}

@keyframes flash {
  0% {
    background: white;
    color: black;
  }

  30% {
    background: #ffffff;
    color: #000000;
  }

  100% {
    background: #111;
    color: white;
  }
}


.secret-button {
  background: #111;
  color: white;
  border: 1px solid white;
}


.remember-button {
  background: white;
  color: black;
  border: 2px solid white;

}
.choice-button {
  opacity: 0;
  transform: translateY(8px);

  animation-name: choiceFadeIn;
  animation-duration: 0.35s;
  animation-timing-function: ease;
  animation-fill-mode: forwards;
}

@keyframes choiceFadeIn {
  0% {
    opacity: 0;
    transform: translateY(8px);
  }

  100% {
    opacity: 1;
    transform: translateY(0);
  }
}
body {

.restore-mode {
  animation: restoreFlash 0.18s linear infinite alternate;
}

@keyframes restoreFlash {
  from {
    filter: brightness(1);
  }

  to {
    filter: brightness(1.18);
  }
}

.restore-glitch {
  animation: restoreGlitch 0.12s linear 8;
}

@keyframes restoreGlitch {
  0% {
    transform: translate(0);
  }

  25% {
    transform: translate(-3px, 1px);
  }

  50% {
    transform: translate(3px, -1px);
  }

  75% {
    transform: translate(-2px, -1px);
  }

  100% {
    transform: translate(0);
  }
}

.restore-error {
  animation: errorFlash 0.15s linear 5;
}

@keyframes errorFlash {
  0% {
    background: #111;
    color: white;
  }

  50% {
    background: #7a0000;
    color: white;
  }

  100% {
    background: #111;
    color: white;
  }

<body>

<div class="game">

  <h2 id="title">
    戀愛模擬器 DEMO
  </h2>


  <div
    id="dialogue"

  >
放學後。

你一個人走在熟悉又有些陌生的走廊上。
  </div>


  <div
    id="buttons"
    class="buttons"
  >

    <button id="startButton">
      繼續 ▶
    </button>

  </div>

</div>

 
<script>

  // =========================
  // 遊戲數值
  // =========================
  let typing = false;
  let typingTimer = null;
  let fullText = "";
  let love = 0;

  let memory = 0;

  let scene = 0;
  let typingComplete = null;
let secretEndingClearedThisRun = false;
let secondPlaythrough =
  localStorage.getItem("secretCleared") === "true";
  let currentDiaryPage = 0;

const diaryEntries = [

  {
    date: "4月17日",

    text:
      "今天又跟他一起回家。\n\n" +

      "明明每次都說自己不餓，" +
      "最後還是會把我的麵包吃掉一半。\n\n" +

      "真的很煩。\n\n" +

      "……\n\n" +

      "不過如果明天他沒有來，" +
      "我大概還是會覺得有點奇怪。"
  },


  {
    date: "5月3日",

    text:
      "他今天又忘記帶東西。\n\n" +

      "我跟他說：\n" +
      "「你遲早有一天連我都會忘記吧。」\n\n" +

      "他居然還笑我想太多。\n\n" +

      "……\n\n" +

      "不知道為什麼，" +
      "我後來一直記得這句話。"
  },


  {
    date: "6月21日",

    text:
      "最近他很奇怪。\n\n" +

      "不是平常那種奇怪。\n\n" +

      "有時候他會突然停下來，" +
      "看著一個明明來過很多次的地方。\n\n" +

      "然後問我：\n\n" +

      "「我們以前有來過這裡嗎？」\n\n" +

      "我不知道該怎麼回答。\n\n" +

      "如果我說有……\n\n" +

      "他會想起來嗎？"
  },


  {
    date: "■■ / ■■",

    text:
      "今天……\n\n" +

      "■■■■■■■■■■\n\n" +

      "我不知道事情為什麼會變成這樣。\n\n" +

      "■■■■■■■■■■■■\n\n" +

      "如果有一天你真的忘了我，\n\n" +

      "至少……\n\n" +

      "■■■■■■\n\n" +

      "不要再找下去了。"
  }

];
  // =========================
  // 角色資料
  // =========================

  const heroineDisplayName =
    "那個女人";


  // 真名先埋在程式裡
  const heroineRealName =
    "小椿";


  // =========================
  // HTML 元件
  // =========================

  const dialogue =
    document.getElementById("dialogue");

  const buttons =
    document.getElementById("buttons");

  const title =
    document.getElementById("title");

  const startButton =
    document.getElementById("startButton");


  // =========================
  // 開場劇情
  // =========================

  const dialogues = [

    "放學後。\n\n你一個人走在熟悉又有些陌生的走廊上。",

    "最近不知道為什麼，\n\n你總覺得有些事情想不起來。",

    "但是醫生說，也許只是太累了。\n\n……大概吧。",

    "突然，身後傳來一道熟悉的聲音。",

    "？？？：你怎麼現在才來？",

    "你轉過身。",

    "明明應該認識她。\n\n可是你卻怎麼也想不起她的名字。",

    "【角色資訊更新】\n\n姓名：那個女人",

    "那個女人：你又在發呆？",

    "你：……沒有。",

    "那個女人：我還以為你已經回去了。"

  ];


  // =========================
  // 按鈕工具
  // =========================
 function typeText(text, speed = 35, onComplete = null) {

  if (typingTimer) {
    clearInterval(typingTimer);
  }

  fullText = text;
  typingComplete = onComplete;

  dialogue.textContent = "";

  let index = 0;
  typing = true;

  typingTimer = setInterval(function () {

    dialogue.textContent += text[index];
    index++;

    if (index >= text.length) {

      clearInterval(typingTimer);

      typingTimer = null;
      typing = false;

      const callback = typingComplete;
      typingComplete = null;

      if (callback) {
        callback();
      }
    }

  }, speed);
}
function finishTyping() {

  if (!typing) {
    return false;
  }

  clearInterval(typingTimer);
  typingTimer = null;

  dialogue.textContent = fullText;
  typing = false;

  const callback = typingComplete;
  typingComplete = null;

  if (callback) {
    callback();
  }

  return true;
}
  function clearButtons() {

    buttons.innerHTML = "";

  }


  function createButton(
    text,
    action
  ) {

    const button =
      document.createElement("button");

    button.textContent =
      text;

    button.addEventListener(
      "click",
      action
    );

    buttons.appendChild(
      button
    );

  }

function createChoiceButton(text, action, delay = 0) {

  const button = document.createElement("button");

  button.textContent = text;
  button.classList.add("choice-button");
  button.style.animationDelay = delay + "ms";

  button.addEventListener("click", function () {
    action();
  });

  buttons.appendChild(button);
}
function continueButton(action) {

  clearButtons();

  createButton(
    "繼續 ▶",
    function () {

      if (finishTyping()) {
        return;
      }

      action();
    }
  );
}


  // =========================
  // 開場
  // =========================

  function nextDialogue() {

    scene++;

    if (
      scene < dialogues.length
    ) {

      typeText(
        dialogues[scene]);

    }

    else {

      firstChoice();

    }

  }


startButton.addEventListener(
  "click",
  function () {

    // 還在跑字 → 先顯示全文
    if (finishTyping()) {
      return;
    }

    // 已經跑完 → 下一句
    nextDialogue();
  }
);

  // =========================
  // 第一次選擇
  // =========================

  function firstChoice() {

  clearButtons();

  typeText(
    "那個女人：要一起回去嗎？",
    35,
    function () {

      // 二周目
      if (secondPlaythrough) {

        showSecondPlaythroughFlash();

      }

      // 一周目
      else {

        showNormalFirstChoices();

      }
    }
  );
}
function showNormalFirstChoices() {

  clearButtons();

  createChoiceButton(
    "好啊",
    firstLoveChoice,
    0
  );

  createChoiceButton(
    "……我們以前常一起走嗎？",
    firstMemoryChoice,
    100
  );

  createChoiceButton(
    "不了，我想自己回去",
    firstBadChoice,
    200
  );
}
function showSecondPlaythroughFlash() {

  clearButtons();

  createChoiceButton(
    "好啊",
    firstLoveChoice,
    0
  );

  createChoiceButton(
    "小椿，我們回去吧",
    function () {},
    100
  );

  createChoiceButton(
    "不了，我想自己回去",
    firstBadChoice,
    200
  );

  // 0.6 秒後異常選項消失
  setTimeout(function () {

    clearButtons();

    createChoiceButton(
      "好啊",
      firstLoveChoice,
      0
    );

    createChoiceButton(
      "不了，我想自己回去",
      firstBadChoice,
      100
    );

  }, 600);
}

  function firstLoveChoice() {

    love += 10;

    typeText(
      "你：好啊。\n\n" +
      "那個女人：嗯，那走吧。\n\n" +
      "她看起來似乎有些安心。");

    continueButton(
      secondScene
    );

  }


  function firstMemoryChoice() {

    love += 3;

    memory += 1;

    typeText(
      "你：……我們以前常一起走嗎？\n\n" +
      "那個女人：……\n\n" +
      "那個女人：你真的不記得？\n\n" +
      "你：什麼？\n\n" +
      "那個女人：沒什麼。走吧。");

    continueButton(
      secondScene
    );

  }


  function firstBadChoice() {

    love -= 8;

   typeText (
      "你：不了，我想自己回去。\n\n" +
      "那個女人：……這樣啊。\n\n" +
      "她沒有再說什麼。\n\n" +
      "你不知道為什麼，\n" +
      "總覺得她的表情有些失落。");

    continueButton(
      secondScene
    );

  }


  // =========================
  // 第二幕
  // =========================

function secondScene() {

  clearButtons();

  typeText(
    "隔天中午。\n\n" +
    "你經過學校中庭。\n\n" +
    "一棵樹映入你的眼簾。\n\n" +
    "你的心中突然出現一種奇怪的熟悉感。\n\n" +
    "那個女人：怎麼了？",
    35,
    function () {

      clearButtons();

      createChoiceButton(
        "沒什麼，去吃東西吧",
        secondLoveChoice,
        0
      );

      if (!secondPlaythrough) {

  createChoiceButton(
    "我是不是以前來過這裡？",
    secondMemoryChoice,
    100
  );

}

      createChoiceButton(
        "沒事，我想一個人待著",
        secondBadChoice,
        200
      );
    }
  );
}
 function secondLoveChoice() {

  love += 10;

  typeText(
    "你：沒什麼，去吃東西吧。\n\n" +
    "那個女人：好啊。\n\n" +
    "她笑了一下。"
  );

  continueButton(dailyScene);
}
 function secondMemoryChoice() {

  love += 3;
  memory += 1;

  typeText(
    "你：我是不是以前來過這裡？\n\n" +
    "那個女人：……當然來過啊。\n\n" +
    "你：我是說……和妳一起。\n\n" +
    "那個女人：……\n\n" +
    "那個女人：你以前很喜歡坐在這裡。"
  );

  continueButton(dailyScene);
}
function secondBadChoice() {

  love -= 8;

  typeText(
    "你：沒事，我想一個人待著。\n\n" +
    "那個女人：……好。\n\n" +
    "她很快移開了視線。\n\n" +
    "這次，她沒有等你。"
  );

  continueButton(dailyScene);
}

// =========================
// 日常事件：福利社

function showHiddenTrigger() {

  // 只有二周目可以出現
  if (!secondPlaythrough) {
    return;
  }

  // 防止重複建立
  if (document.getElementById("hidden-trigger")) {
    return;
  }

  const hiddenButton =
    document.createElement("button");

  hiddenButton.id = "hidden-trigger";
  hiddenButton.classList.add("hidden-trigger");

  hiddenButton.textContent = "？";

  hiddenButton.addEventListener(
    "click",
    showHiddenNameInput
  );

  document.body.appendChild(hiddenButton);
}
function showHiddenNameInput() {

  const panel =
    document.getElementById("hidden-name-panel");

  const input =
    document.getElementById("hidden-name-input");

  const message =
    document.getElementById("hidden-name-message");

  message.textContent = "";
  input.value = "";

  panel.classList.add("show");

  input.focus();
}
function closeHiddenNameInput() {

  const panel =
    document.getElementById("hidden-name-panel");

  panel.classList.remove("show");
}
function checkHiddenName() {

  const input =
    document.getElementById("hidden-name-input");

  const message =
    document.getElementById("hidden-name-message");

  const name =
    input.value.trim();

  if (name === "") {

    message.textContent =
      "請輸入資料。";

    return;
  }


  if (name === heroineRealName) {

    message.textContent =
      "……";

    setTimeout(function () {

      message.textContent =
        "ERROR：此資料不應存在。";

    }, 700);

    setTimeout(function () {

      closeHiddenNameInput();

      foundTsubakiDiary();

    }, 1800);

  }

  else {

    message.textContent =
      "查無資料。";

  }
}

function openDiary() {

  currentDiaryPage = 0;

  const panel =
    document.getElementById("diary-panel");

  panel.classList.add("show");

  showDiaryPage();
}
function showDiaryPage() {

  const entry =
    diaryEntries[currentDiaryPage];

  document.getElementById(
    "diary-date"
  ).textContent =
    entry.date;

  document.getElementById(
    "diary-text"
  ).textContent =
    entry.text;

  document.getElementById(
    "diary-page-number"
  ).textContent =
    (currentDiaryPage + 1) +
    " / " +
    diaryEntries.length;


  const prevButton =
    document.getElementById("diary-prev");

  const nextButton =
    document.getElementById("diary-next");


  // 第一頁不能往前
  prevButton.disabled =
    currentDiaryPage === 0;


  // 最後一頁：下一頁改成嘗試恢復
  if (
    currentDiaryPage ===
    diaryEntries.length - 1
  ) {

    nextButton.disabled = false;

    nextButton.textContent =
      "嘗試恢復";

    nextButton.onclick =
      restoreDiaryData;

  }

  // 其他頁：正常下一頁
  else {

    nextButton.disabled = false;

    nextButton.textContent =
      "下一頁 ▶";

    nextButton.onclick =
      nextDiaryPage;
  }
}
function nextDiaryPage() {

  if (
    currentDiaryPage <
    diaryEntries.length - 1
  ) {

    currentDiaryPage++;

    showDiaryPage();
  }
}


function previousDiaryPage() {

  if (currentDiaryPage > 0) {

    currentDiaryPage--;

    showDiaryPage();
  }
}
function closeDiary() {

  const panel =
    document.getElementById("diary-panel");

  panel.classList.remove("show");
}
function restoreDiaryData() {

  // 關掉日記
  closeDiary();

  clearButtons();

  title.textContent =
    "SYSTEM";

  typeText(
    "正在恢復缺失資料……\n\n" +
    "31%\n\n" +
    "54%\n\n" +
    "82%\n\n" +
    "……\n\n" +
    "ERROR\n\n" +
    "未授權存取。\n\n" +
    "正在終止連線……",
    35,
    function () {

      setTimeout(function () {

        kickToTitle();

      }, 1500);

    }
  );
}
function startGame() {

  const titleScreen =
    document.getElementById("title-screen");

  const game =
    document.querySelector(".game");

  titleScreen.style.opacity = "0";

  setTimeout(function () {

    titleScreen.style.display = "none";

    // 顯示遊戲本體
    game.style.display = "block";

    // 二周目才顯示問號
    if (secondPlaythrough) {
      showHiddenTrigger();
    }

    // 正式開始第一句
    scene = 0;
    typeText(dialogues[0]);

  }, 500);
}
function restoreDiaryData() {

  // 日記立刻消失
  const diaryPanel =
    document.getElementById("diary-panel");

  diaryPanel.classList.remove("show");

  clearButtons();

  title.textContent = "SYSTEM";

  document.body.classList.add(
    "restore-mode"
  );

  dialogue.classList.add(
    "restore-glitch"
  );

  typeText(
    "正在恢復缺失資料……"
  );


  setTimeout(function () {

    dialogue.textContent =
      "正在恢復缺失資料……\n\n31%";

  }, 900);


  setTimeout(function () {

    dialogue.textContent =
      "正在恢復缺失資料……\n\n54%";

  }, 1600);


  setTimeout(function () {

    dialogue.textContent =
      "正在恢復缺失資料……\n\n82%";

    dialogue.classList.add(
      "restore-error"
    );

  }, 2300);


  setTimeout(function () {

    dialogue.textContent =
      "ERROR\n\n" +
      "未授權存取。";

  }, 3000);


  setTimeout(function () {

    dialogue.textContent =
      "ERROR\n\n" +
      "未授權存取。\n\n" +
      "正在終止連線……";

  }, 3700);


  setTimeout(function () {

    document.body.classList.remove(
      "restore-mode"
    );

    dialogue.classList.remove(
      "restore-glitch"
    );

    dialogue.classList.remove(
      "restore-error"
    );

    kickToTitle();

  }, 5200);
}
function kickToTitle() {

  // 關閉日記
  const diaryPanel =
    document.getElementById("diary-panel");

  if (diaryPanel) {
    diaryPanel.classList.remove("show");
  }

  // 隱藏遊戲
  const game =
    document.querySelector(".game");

  if (game) {
    game.style.display = "none";
  }

  // 顯示封面
  const titleScreen =
    document.getElementById("title-screen");

  titleScreen.style.display = "flex";
  titleScreen.style.opacity = "1";
}
function confirmResetData() {

  const confirmed = confirm(
    "確定要清除遊戲資料並回到一周目嗎？"
  );

  if (!confirmed) {
    return;
  }

  resetPlaythrough();
}


function resetPlaythrough() {

  // 清除二周目紀錄
  localStorage.removeItem("secretCleared");

  // 清除目前遊戲狀態
  secondPlaythrough = false;
  secretEndingClearedThisRun = false;

  love = 0;
  memory = 0;
  scene = 0;

  // 重新整理
  window.location.reload();
}

  // =========================
  // 重新開始
  // =========================

  function showRestart() {

  clearButtons();

  // SECRET END 剛通關
  if (secretEndingClearedThisRun) {

    const restartButton =
      document.createElement("button");

    restartButton.textContent =
      "重新開始 ↻";

    restartButton.addEventListener(
      "click",
      restartGame
    );

    buttons.appendChild(
      restartButton
    );

    // 一秒後文字發生異常
    setTimeout(function () {

      restartButton.textContent =
        "再一次……？";

      restartButton.classList.add(
        "glitch"
      );

      setTimeout(function () {

        restartButton.classList.remove(
          "glitch"
        );

      }, 600);

    }, 1000);

  }

  // 普通結局
  else {

    createButton(
      "重新開始 ↻",
      restartGame
    );

  }
}

 function restartGame() {

  love = 0;
  memory = 0;
  scene = 0;

  secondPlaythrough =
    localStorage.getItem("secretCleared") === "true";

  document.body.classList.remove(
    "secret-mode"
  );

  secretEndingClearedThisRun = false;

  title.textContent =
    "戀愛模擬器 DEMO";

  dialogue.style.background =
    "white";

  dialogue.style.color =
    "black";

  dialogue.style.borderColor =
    "#333";

  typeText(
    dialogues[0]
  );

  clearButtons();

  createButton(
    "繼續 ▶",
    nextDialogue
  );

  // 二周目才顯示問號
  if (secondPlaythrough) {
    showHiddenTrigger();
  }
}

</script>
